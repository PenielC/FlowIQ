services:
  - type: web
    name: flowiq-api
    runtime: docker
    plan: 1c-2g
    dockerfilePath: ./src/FlowIQ.Api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8080
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Redis__ConnectionString
        sync: false
      - key: Jwt__Issuer
        value: FlowIQ
      - key: Jwt__Audience
        value: FlowIQ
      - key: Jwt__Secret
        generateValue: true
      - key: Jwt__AccessTokenExpiryMinutes
        value: 60
      - key: Jwt__RefreshTokenExpiryDays
        value: 7
      - key: Cors__AllowedOrigins__0
        sync: false
      - key: App__WebBaseUrl
        sync: false
      - key: Stripe__SecretKey
        sync: false
      - key: Stripe__WebhookSecret
        sync: false
      # Resend — paste the API key from the Resend dashboard
      - key: Email__ResendApiKey
        sync: false
      - key: Email__FromAddress
        sync: false
      - key: Admin__AllowedEmails__0
        value: peniel.chingombe@gmail.com
      - key: Feedback__RecipientEmail
        value: peniel.chingombe@gmail.com

  - type: web
    name: flowiq-web
    runtime: static
    buildCommand: cd apps/web && npm install && npm run build
    staticPublishPath: ./apps/web/dist
    routes:
      # The blog and sitemap are rendered by the API; pass them through so they live on the main domain.
      # Must come before the /* rule. Replace the host if the API service's URL differs.
      - type: rewrite
        source: /blog
        destination: https://flowiq-api-9gx9.onrender.com/blog
      - type: rewrite
        source: /blog/*
        destination: https://flowiq-api-9gx9.onrender.com/blog/*
      - type: rewrite
        source: /sitemap.xml
        destination: https://flowiq-api-9gx9.onrender.com/sitemap.xml
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
